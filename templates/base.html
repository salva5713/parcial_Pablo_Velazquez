<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
        }
        .logo {
            max-height: 120px;
        }
        .container-main {
            max-width: 960px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="text-center mt-3">
        <img src="{{ url_for('static', filename='img/logo_azul.png') }}" alt="Logo Centro Politécnico" class="logo">
    </div>
    <div class="text-center mt-3">
        <h1>Centro Politecnico Malvinas Argentinas</h1>
        <h3>Parcial Programacion II</h3>
    </div>
    <div class="container-main">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
